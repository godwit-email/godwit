[tools]
go = "1.27.4"
bun = "1.4.2"

[tasks."web:install"]
dir = "web"
run = "bun install --frozen-lockfile"

# The system-translation bridge the Mac app ships (native/systemtranslate).
[tasks."native:translate"]
run = "scripts/build-system-translate.sh"
run_windows = "echo the system-translation bridge is macOS only"

# The Apple Intelligence helper the Mac app ships (native/appleintelligence).
[tasks."native:apple-intelligence"]
run = "scripts/build-apple-intelligence.sh"
run_windows = "echo the Apple Intelligence helper is macOS only"

# The CoreML bridge 识别模型 reads with on a Mac (native/guardcoreml).
[tasks."native:guard-coreml"]
run = "scripts/build-guard-coreml.sh"
run_windows = "echo the recognition model's CoreML bridge is macOS only"

# The pi bundle the AI engine embeds (core/ai/pi/engine.js, committed); CI checks it is current.
[tasks."ai:bundle"]
dir = "core/ai/pi/js"
run = "bun install --frozen-lockfile --ignore-scripts && bun run build"

[tasks.dev]
depends = ["web:install", "native:translate", "native:apple-intelligence", "native:guard-coreml"]
run = "go tool mygo dev"

[tasks."dev:sync-db"]
description = "Replace the dev database from production; stop both apps first"
depends = ["generate"]
run = "go run ./cmd/godwit dev-sync-db"

[tasks.build]
depends = ["web:install", "native:translate", "native:apple-intelligence", "native:guard-coreml"]
run = "go tool mygo build -skip-dmg -skip-notarize"

[tasks.generate]
depends = ["web:install"]
run = "go tool mygo generate"

# The Go checks CI runs before its tests.
[tasks."go:check"]
depends = ["generate"]
run = [
  "test -z \"$(gofmt -l $(git ls-files '*.go'))\"",
  "out=\"$(go tool mygo i18n check 2>&1)\"; printf '%s\\n' \"$out\"; ! printf '%s\\n' \"$out\" | grep -q 'warning:'",
  "go vet ./...",
  "go build ./...",
]

# Like CI, run richtext's wall-clock checks alone so other packages don't slow them past their limits.
[tasks."go:test"]
depends = ["generate"]
run = [
  "go test $(go list ./... | grep -v '/internal/richtext$')",
  "go test -p 1 ./internal/richtext",
]

# What CI checks, one step after another; run before pushing.
[tasks.check]
run = [{ task = "go:check" }, { task = "web:check" }, { task = "go:test" }]

[tasks."web:test"]
dir = "web"
depends = ["generate"]
run = "bun run test"

[tasks."web:lint"]
dir = "web"
depends = ["web:install"]
run = "bun run lint"

[tasks."web:components"]
dir = "web"
depends = ["web:install"]
run = "bun run components"

[tasks."web:check"]
dir = "web"
depends = ["generate"]
run = 'bun run typecheck && bun run lint && bun run test && bun run components && bun run views && test -z "$(git status --porcelain -- . ../mcpserver/views)"'

[tasks."site:install"]
dir = "site"
run = "bun install --frozen-lockfile"

[tasks."site:dev"]
dir = "site"
depends = ["site:install"]
run = "bun run dev"

[tasks."site:check"]
dir = "site"
depends = ["site:install"]
run = "bun run typecheck && bun run test && bun run build"
