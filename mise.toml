[tools]
go = "1.27.1"
bun = "1.4.2"

[tasks."web:install"]
dir = "web"
run = "bun install --frozen-lockfile"

# The system-translation bridge the Mac app ships (native/systemtranslate).
[tasks."native:translate"]
run = "scripts/build-system-translate.sh"
run_windows = "echo the system-translation bridge is macOS only"

# The Apple Intelligence helper the Mac app ships (native/appleintelligence).
[tasks."native:apple-intelligence"]
run = "scripts/build-apple-intelligence.sh"
run_windows = "echo the Apple Intelligence helper is macOS only"

[tasks.dev]
depends = ["web:install", "native:translate", "native:apple-intelligence"]
run = "go tool mygo dev"

[tasks."dev:sync-db"]
description = "Replace the dev database from production; stop both apps first"
depends = ["generate"]
run = "go run ./cmd/godwit dev-sync-db"

[tasks.build]
depends = ["web:install", "native:translate", "native:apple-intelligence"]
run = "go tool mygo build -skip-dmg -skip-notarize"

[tasks.generate]
depends = ["web:install"]
run = "go tool mygo generate"

[tasks."web:test"]
dir = "web"
depends = ["generate"]
run = "bun run test"

[tasks."web:lint"]
dir = "web"
depends = ["web:install"]
run = "bun run lint"

[tasks."web:components"]
dir = "web"
depends = ["web:install"]
run = "bun run components"

[tasks."web:check"]
dir = "web"
depends = ["generate"]
run = 'bun run typecheck && bun run lint && bun run test && bun run components && bun run views && test -z "$(git status --porcelain -- . ../mcpserver/views)"'

[tasks."site:install"]
dir = "site"
run = "bun install --frozen-lockfile"

[tasks."site:dev"]
dir = "site"
depends = ["site:install"]
run = "bun run dev"

[tasks."site:check"]
dir = "site"
depends = ["site:install"]
run = "bun run typecheck && bun run test && bun run build"
