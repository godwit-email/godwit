[tools]
go = "1.27.1"
bun = "1.4.2"
node = "26"

[tasks."web:install"]
dir = "web"
run = "bun install --frozen-lockfile"

[tasks.dev]
depends = ["web:install"]
run = "go tool mygo dev"

[tasks."dev:sync-db"]
description = "Replace the dev database from production; stop both apps first"
depends = ["generate"]
run = "go run ./cmd/godwit dev-sync-db"

[tasks.build]
depends = ["web:install"]
run = "go tool mygo build -skip-dmg -skip-notarize"

[tasks.generate]
depends = ["web:install"]
run = "go tool mygo generate"

[tasks."web:test"]
dir = "web"
depends = ["generate"]
run = "bun run test"

[tasks."web:lint"]
dir = "web"
depends = ["web:install"]
run = "bun run lint"

[tasks."web:components"]
dir = "web"
depends = ["web:install"]
run = "bun run components"

[tasks."web:check"]
dir = "web"
depends = ["generate"]
run = 'bun run typecheck && bun run lint && bun run test && bun run components && test -z "$(git status --porcelain -- .)"'

[tasks."site:install"]
dir = "site"
run = "bun install --frozen-lockfile"

[tasks."site:dev"]
dir = "site"
depends = ["site:install"]
run = "bun run dev"

[tasks."site:check"]
dir = "site"
depends = ["site:install"]
run = "bun run typecheck && bun run test && bun run build"
