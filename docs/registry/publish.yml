# .github/workflows/publish.yml of the plugins repository (docs/registry/README.md).
# A pull request is checked; a merge to main is checked, signed and published.
name: Publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Godwit's own validator and signer, from its main branch's source (not the module proxy, which lags).
      - uses: actions/checkout@v4
        with:
          repository: godwit-email/godwit
          path: godwit
      - uses: actions/setup-go@v5
        with:
          go-version-file: godwit/go.mod
          cache-dependency-path: godwit/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # core/plugins imports internal/i18n, whose catalog_gen.go is generated and not committed.
      - name: Generate Godwit's sources
        run: |
          (cd godwit/web && bun install --frozen-lockfile)
          cd godwit && go tool mygo generate
      - name: Build registry.json from the directory and each plugin's pinned commit
        run: cd godwit && go run ./cmd/godwit-registry build ../directory.json ../registry.json
      # What the reviewer approves: the difference this pull request makes to what is published.
      - name: Show what changes
        if: github.event_name == 'pull_request'
        run: |
          curl -fsS https://dl.godwit.email/plugins/registry.json | jq -S 'del(.updated)' > published.json
          jq -S 'del(.updated)' registry.json > built.json
          { echo '```diff'; diff -u published.json built.json || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Godwit's own validator: what passes here is what the app accepts.
      - name: Check every release and download every file
        run: cd godwit && go run ./cmd/godwit-registry check --fetch ../registry.json
      - name: Sign
        if: github.event_name == 'push'
        env:
          GODWIT_REGISTRY_KEY: ${{ secrets.GODWIT_REGISTRY_KEY }}
        run: cd godwit && go run ./cmd/godwit-registry sign ../registry.json
      # The bucket dl.godwit.email serves; the app reads plugins/registry.json and its .sig.
      - name: Upload
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://9c578ed9cad837fb4a2564db7b36b483.r2.cloudflarestorage.com
        run: |
          aws s3 cp registry.json s3://godwit-downloads/plugins/registry.json --endpoint-url "$R2" --cache-control no-cache --content-type application/json
          aws s3 cp registry.json.sig s3://godwit-downloads/plugins/registry.json.sig --endpoint-url "$R2" --cache-control no-cache --content-type text/plain
