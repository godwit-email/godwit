<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 E · 邮件 / 地址标签</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; background: #FFFFFF; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #0A0A0A">
<sc-for list="{{panels}}" as="p" hint-placeholder-count="2">
<section aria-label="{{p.label}}" style="{{p.style}}">
<span style="align-self: flex-start; font-size: 12px; color: #737373">{{p.label}}</span>
<span style="{{p.avatarStyle}}">{{p.initial}}</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">{{p.name}}</h1>
<span style="color: #737373">{{p.sub}}</span>
<span style="color: #737373">{{p.primary}}</span>
</div>
<div style="display: flex; gap: 24px">
<sc-for list="{{actions}}" as="x" hint-placeholder-count="3">
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: none; color: #0A0A0A; font-size: 12px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #F5F5F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{x.d}}"></path></svg></span>{{x.label}}</button>
</sc-for>
</div>
<div style="align-self: stretch; display: flex; flex-direction: column">
<div role="tablist" style="display: flex; gap: 20px; border-bottom: 1px solid #E5E5E5; padding: 0 12px">
<button type="button" role="tab" aria-selected="false" style="padding: 8px 0; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: #737373; font-size: 14px">邮件 <span style="font-size: 12px">{{p.mailCount}}</span></button>
<button type="button" role="tab" aria-selected="true" style="padding: 8px 0; border: none; border-bottom: 2px solid #0A0A0A; margin-bottom: -1px; background: none; color: #0A0A0A; font-size: 14px; font-weight: 500">地址 <span style="font-size: 12px; color: #737373">{{p.addrCount}}</span></button>
</div>
<div style="position: relative; display: flex; flex-direction: column; padding-top: 4px">
<sc-for list="{{p.rows}}" as="r" hint-placeholder-count="6">
<button type="button" style="{{r.style}}"><span style="flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.addr}}</span><span style="{{r.tagStyle}}">{{r.tag}}</span><span style="width: 64px; flex: none; text-align: right; font-size: 12px; color: #737373">{{r.count}}</span></button>
</sc-for>
<sc-if value="{{p.menu}}">
<div role="menu" style="position: absolute; top: 104px; right: 8px; width: 180px; box-sizing: border-box; padding: 4px; border: 1px solid #E5E5E5; border-radius: 10px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; z-index: 2">
<button type="button" role="menuitem" style="text-align: left; padding: 6px 8px; border: none; border-radius: 6px; background: #F5F5F5; font-size: 14px; color: #0A0A0A">写邮件</button>
<button type="button" role="menuitem" style="text-align: left; padding: 6px 8px; border: none; border-radius: 6px; background: none; font-size: 14px; color: #0A0A0A">复制地址</button>
<button type="button" role="menuitem" style="text-align: left; padding: 6px 8px; border: none; border-radius: 6px; background: none; font-size: 14px; color: #0A0A0A">只看这个地址的邮件</button>
<div style="height: 1px; margin: 4px 0; background: #E5E5E5"></div>
<button type="button" role="menuitem" style="text-align: left; padding: 6px 8px; border: none; border-radius: 6px; background: none; font-size: 14px; color: #0A0A0A">屏蔽这个地址</button>
</div>
</sc-if>
</div>
<span style="padding: 8px 12px 0; font-size: 12px; color: #737373">{{p.foot}}</span>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var row = function (addr, tag, count, hover) {
      return {
        addr: addr, tag: tag, count: count,
        style: 'display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border: none; border-radius: 8px; font-size: 14px; color: #0A0A0A; background: ' + (hover ? '#F5F5F5' : 'transparent'),
        tagStyle: 'flex: none; font-size: 12px; color: ' + (tag === '已屏蔽' ? '#B91C1C' : '#737373')
      };
    };
    var panel = function (o, last) {
      return Object.assign(o, {
        style: 'flex: 1; box-sizing: border-box; padding: 28px 48px; display: flex; flex-direction: column; align-items: center; gap: 14px' + (last ? '' : '; border-right: 1px solid #E5E5E5'),
        avatarStyle: 'width: 60px; height: 60px; border-radius: 50%; background: ' + o.bg + '; color: ' + o.fg + '; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600'
      });
    };
    return {
      actions: [
        { label: '写邮件', d: 'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z' },
        { label: '全部归档', d: 'M3 4h18v4H3z M5 8v12h14V8 M10 12h4' },
        { label: '屏蔽', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18 M5.6 5.6l12.8 12.8' }
      ],
      panels: [
        panel({ label: '一个地址', initial: '周', bg: '#E0E7FF', fg: '#3730A3', name: '周明', sub: '矩石架构 · 基础设施顾问', primary: 'zhouming@matrix.example', mailCount: '18', addrCount: '1', menu: false,
          rows: [row('zhouming@matrix.example', '', '18 封', false)],
          foot: '一个地址也是这张列表，只有一行；默认停在「邮件」标签，这里切到了「地址」' }, false),
        panel({ label: '30 个地址 · 点开第 3 行', initial: '运', bg: '#DCFCE7', fg: '#166534', name: '运维告警', sub: '星云科技 · 基础设施组', primary: 'ops@nebula.example', mailCount: '1,204', addrCount: '30', menu: true,
          rows: [
            row('ops@nebula.example', '首选', '412 封', false),
            row('alerts@nebula.example', '', '388 封', false),
            row('oncall@nebula.example', '', '201 封', true),
            row('noreply-monitor@nebula.example', '已屏蔽', '96 封', false),
            row('grafana@nebula.example', '', '57 封', false),
            row('pager-east@nebula.example', '', '31 封', false)
          ],
          foot: '列表跟着页面往下滚，30 个、300 个都一样；按往来邮件数排，首选在最前' }, true)
      ]
    };
  }
}
</script>
</body>
</html>
