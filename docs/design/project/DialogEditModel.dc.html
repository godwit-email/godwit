<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弹层 · 编辑模型服务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
button,input{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #0A0A0A">
  <dc-import name="SettingsModels" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; border-radius: 12px; background-color: #00000033; display: flex; align-items: flex-start; justify-content: center; padding-top: 64px">
      <div style="width: 640px; box-sizing: border-box; border-radius: 16px; background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid #E5E5E5; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden">
        <div style="display: flex; align-items: flex-start; gap: 16px; padding: 16px 16px 0 16px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding-top: 0px">
            <div style="font-size: 16px; font-weight: 600; line-height: 1.4">编辑 · OpenAI</div>
            <div style="color: #737373; line-height: 1.6">Key 只存在本机钥匙串里。</div>
          </div>
          <button type="button" aria-label="关闭" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #737373; display: flex; align-items: center; justify-content: center; padding: 0; flex: none; margin-right: -8px; margin-top: -8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px">
          <label style="display: flex; flex-direction: column; gap: 8px; font-weight: 500">名称<input type="text" value="OpenAI" style="height: 36px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 6px; padding: 0 12px; font-size: 14px; font-weight: 400; color: #0A0A0A"></label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-weight: 500">API Key<input type="password" value="sk-placeholder" style="height: 36px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 6px; padding: 0 12px; font-size: 14px; font-weight: 400; color: #0A0A0A"></label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-weight: 500">Base URL<input type="url" value="https://api.openai.com/v1" style="height: 36px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 6px; padding: 0 12px; font-size: 14px; font-weight: 400; color: #0A0A0A"></label>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #E5E5E5; background: #FAFAFA">
          <button type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #E7000B; font-weight: 500">删除</button>
          <div style="flex: 1"></div>
          <button type="button" style="height: 32px; padding: 0 14px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; color: #0A0A0A; font-weight: 500">取消</button>
          <button type="button" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #171717; color: #FFFFFF; font-weight: 500">保存</button>
        </div>
      </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
