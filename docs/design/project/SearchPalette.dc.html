<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Godwit 搜索弹层</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0A0A0A}a:hover{color:#0A0A0A}
button{font:inherit;cursor:pointer}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;box-sizing:border-box;padding:0 4px;border:1px solid rgba(10,10,10,0.12);border-radius:4px;font:inherit;font-size:11px;color:#737373}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: Geist, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px; color: #0A0A0A">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <dc-import name="Main" platform="mac" initial-summary="false" hint-size="1440px,900px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background-color: #00000033"></div>

  <div role="dialog" aria-modal="true" aria-label="搜索" style="position: absolute; left: 400px; top: 96px; width: 640px; display: flex; flex-direction: column; background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid #E5E5E5; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden">

    <sc-if value="{{searching}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 12px 0 20px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="0">

      </sc-for>
      <input type="search" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-label="搜索" value="{{query}}" onInput="{{onInput}}" onKeyDown="{{onKey}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 40px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: #0A0A0A; outline: none">

    </div>

    <div role="tablist" aria-label="类型" style="display: flex; align-items: center; gap: 4px; padding: 0 16px 12px; border-bottom: 1px solid rgba(10,10,10,0.08)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.selText}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="position: relative">
      <div id="palette-list" role="listbox" aria-label="结果" style="height: 452px; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column">

          <div role="group" aria-label="{{s.title}}" style="display: flex; flex-direction: column; gap: 2px">
            <div style="padding: 12px 12px 6px; font-size: 12px; color: #737373">{{s.title}}</div>
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
              <sc-if value="{{r.isLink}}" hint-placeholder-val="{{ true }}">
                <a href="{{r.href}}" role="option" aria-selected="{{r.selText}}" onMouseEnter="{{r.hover}}" style="{{r.style}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="{{r.iconStyle}}"><path d="{{r.icon}}"></path></svg>
                  <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><sc-for list="{{r.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.hit}}" hint-placeholder-val="{{ false }}"><mark style="padding: 0 1px; border-radius: 2px; background: #FFF085; color: #0A0A0A">{{g.t}}</mark></sc-if><sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}"><span>{{g.t}}</span></sc-if></sc-for><span style="margin-left: 8px; color: #737373">{{r.sub}}</span></span>
                  <sc-if value="{{r.unread}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="未读" style="width: 6px; height: 6px; flex: none; border-radius: 50%; background: #2B7FFF"></span></sc-if>
                  <sc-if value="{{r.off}}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #737373">{{r.meta}}</span><sc-if value="{{r.kbd}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 4px"><sc-for list="{{r.keys}}" as="k" hint-placeholder-count="1"><kbd>{{k.t}}</kbd></sc-for></span></sc-if></sc-if>
                  <sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: flex; align-items: center; gap: 4px"><button type="button" aria-label="更多操作" onClick="{{r.more}}" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #404040; font-size: 14px; line-height: 1">···</button><kbd>↵</kbd></span></sc-if>
                </a>
              </sc-if>
              <sc-if value="{{r.isFill}}" hint-placeholder-val="{{ false }}">
                <button type="button" role="option" aria-selected="{{r.selText}}" onClick="{{r.fill}}" onMouseEnter="{{r.hover}}" style="{{r.style}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="{{r.iconStyle}}"><path d="{{r.icon}}"></path></svg>
                  <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left">{{r.title}}<span style="margin-left: 8px; color: #737373">{{r.sub}}</span></span>

                </button>
              </sc-if>
            </sc-for>
          </div>
        </sc-for>
        <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 32px 24px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">

        </div>
      </div>

      <span style="display: flex; align-items: center; gap: 6px">筛选条件<kbd>/</kbd></span>
      <span style="display: flex; align-items: center; gap: 6px">操作<kbd>⌥</kbd><kbd>↵</kbd></span>
      <button type="button" data-wit="true" onClick="{{toggleAsk}}" style="margin-left: auto; display: flex; align-items: center; gap: 6px; border: 0; padding: 0; background: transparent; font: inherit; color: #737373">问 Wit<kbd>Tab</kbd></button>

      <div style="font-size: 14px; font-weight: 600; line-height: 1.4"><sc-for list="{{preview.subject}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.hit}}" hint-placeholder-val="{{ false }}"><mark style="padding: 0 1px; border-radius: 2px; background: #FFF085; color: #0A0A0A">{{g.t}}</mark></sc-if><sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}"><span>{{g.t}}</span></sc-if></sc-for></div>

    </aside>
  </sc-if>
</div>
</x-dc>

    var CMDS = [
      { t: '写邮件', kbd: '⌘N', icon: I.write, href: 'Compose.dc.html' },
      { t: '新对话', sub: 'Wit', kbd: '', icon: I.chat, href: 'WitEmpty.dc.html' },
      { t: '转到草稿', kbd: '', icon: I.arrow, href: 'MainDrafts.dc.html' },
      { t: '管理标签', kbd: '', icon: I.settings, href: 'SettingsLabels.dc.html' },
      { t: '添加账户', kbd: '', icon: I.add, href: 'SettingsAccounts.dc.html' },
      { t: '打开设置', kbd: '⌘,', icon: I.settings, href: 'SettingsGeneral.dc.html' }
    ];
    var FILTERS = [['有附件', '只看带附件的邮件'], ['未读', ''], ['账户：工作', 'you@company.example'], ['文件夹：收件箱', ''], ['最近 7 天', '']];
    var ACTIONS = {
      mail: [['回复', 'R'], ['全部回复', '⇧R'], ['归档', 'E'], ['标为未读', 'U'], ['打标签…', 'L']],
      chat: [['打开对话', '↵'], ['重命名', ''], ['删除', '']],
      person: [['写邮件', ''], ['查看往来邮件', ''], ['复制地址', '⌘C']],
      file: [['快速预览', 'Space'], ['存储到…', '⌘S'], ['打开所在邮件', '']],
      cmd: [['运行', '↵']]
    };

    var q = st.q, scope = st.scope, ql = q.trim().toLowerCase(), F = st.filters;
    var active = !!ql || F.length > 0;
    var has = function (x) { return !ql || (x.t + ' ' + (x.sub || '') + ' ' + (x.body || '')).toLowerCase().indexOf(ql) >= 0; };
    var mailOk = function (m) { return has(m) && (F.indexOf('有附件') < 0 || m.file) && (F.indexOf('未读') < 0 || m.unread); };
    var segs = function (t) {
      var i = ql ? t.toLowerCase().indexOf(ql) : -1;
      if (i < 0) return [{ t: t, hit: false, plain: true }];
      return [{ t: t.slice(0, i), hit: false, plain: true }, { t: t.slice(i, i + ql.length), hit: true, plain: false }, { t: t.slice(i + ql.length), hit: false, plain: true }];
    };
    // kit.Avatar: a 32px rounded square (radius-lg) with the name's initial, in a
    // label color but gray picked by FNV-1a of the name. The app shows the sender's
    // favicon or Gravatar instead when one is found; these example domains have none.
    var AVATAR = [['#FFE2E2', '#C10007'], ['#FFEDD4', '#CA3500'], ['#FEF3C6', '#BB4D00'], ['#FEF9C2', '#A65F00'], ['#ECFCCA', '#497D00'], ['#DCFCE7', '#008236'], ['#CBFBF1', '#00786F'], ['#DFF2FE', '#0069A8'], ['#DBEAFE', '#1447E6'], ['#EDE9FE', '#7008E7'], ['#FCE7F3', '#C6005C']];
    var avatarStyle = function (name) {
      var h = 0x811c9dc5;
      new TextEncoder().encode(name).forEach(function (b) { h = Math.imul(h ^ b, 0x01000193) >>> 0; });
      var c = AVATAR[h % AVATAR.length];
      return 'width: 32px; height: 32px; flex: none; border-radius: 8px; background: ' + c[0] + '; color: ' + c[1] + '; font-size: 13px; font-weight: 600; line-height: 1; display: flex; align-items: center; justify-content: center';
    };
    // one line like every other row; the selected mail's details go to the preview card
    var mailRow = function (m) {
      return { kind: 'link', act: 'mail', title: m.t, sub: (m.to || '') + m.sub + (m.folder ? ' · ' + m.folder : ''), meta: m.meta, kbd: '', icon: I.mail, href: 'Main.dc.html', unread: !!m.unread, mail: m };
    };
    var row = function (x, icon, href, act) { return { kind: 'link', act: act, title: x.t, sub: x.sub || '', meta: x.meta || '', kbd: x.kbd || '', icon: x.icon || icon, href: x.href || href }; };
    var chatRow = function (c) { return row(c, I.chat, 'Ask.dc.html', 'chat'); };
    var personRow = function (p) { return row(p, I.user, 'MainSearch.dc.html', 'person'); };
    var fileRow = function (f) { return row(f, I.file, 'Main.dc.html', 'file'); };
    var cmdRow = function (c) { return row(c, null, null, 'cmd'); };
    var cap = function (list, n) { return scope === 'all' ? list.slice(0, n) : list; };

    var raw = [];
    var mails = MAILS.filter(mailOk), chats = CHATS.filter(has), people = PEOPLE.filter(has), files = FILES.filter(has), cmds = CMDS.filter(has);
    if (F.length) { chats = []; people = []; cmds = []; }
    if (st.menu === 'filter') {
      raw.push({ title: '筛选条件', rows: FILTERS.filter(function (f) { return F.indexOf(f[0]) < 0; }).map(function (f) {
        return { kind: 'fill', title: f[0], sub: f[1], icon: I.filter, fill: function () { self.setState({ filters: F.concat([f[0]]), menu: '', sel: 0 }); } };
      }) });
    } else if (!active && scope === 'all') {
      raw.push({ title: '最近使用', rows: [mailRow(MAILS[0]), chatRow(CHATS[0]), mailRow(MAILS[3]), fileRow(FILES[0]), chatRow(CHATS[1])] });
      raw.push({ title: '操作', rows: CMDS.slice(0, 2).map(cmdRow) });
    } else {
      if (scope === 'all' || scope === 'mail') raw.push({ title: active ? '邮件 · ' + mails.length : '最近打开的邮件', rows: cap(mails, 3).map(mailRow) });
      if (scope === 'all' || scope === 'chats') raw.push({ title: active ? '对话' : 'Wit 对话', rows: cap(chats, 2).map(chatRow) });
      if (scope === 'all' || scope === 'people') raw.push({ title: active ? '联系人' : '常用联系人', rows: cap(people, 2).map(personRow) });
      if (scope === 'all' || scope === 'files') raw.push({ title: active ? '附件' : '最近的附件', rows: cap(files, 2).map(fileRow) });
      if (scope === 'all') raw.push({ title: '操作', rows: cmds.slice(0, 3).map(cmdRow) });
      if (active && mails.length > 3 && scope === 'all') raw.push({ title: '更多', rows: [{ kind: 'link', act: 'cmd', title: '在邮件列表中查看全部 ' + mails.length + ' 封', sub: '', meta: '', kbd: '⌘↵', icon: I.search, href: 'MainSearch.dc.html', seeAll: true }] });
    }
    raw = raw.filter(function (s) { return s.rows.length; });

    var flat = [];
    raw.forEach(function (s) { s.rows.forEach(function (r) { flat.push(r); }); });
    var sel = Math.max(0, Math.min(st.sel, flat.length - 1));
    var n = 0, y = 4, selY = 0;
    var sections = raw.map(function (s) {
      y += 38; // section heading
      return { title: s.title, rows: s.rows.map(function (r) {
        var i = n++, on = i === sel;
        if (on) selY = y;
        y += 42;
        return Object.assign({}, r, {
          keys: keysOf(r.kbd), isLink: r.kind === 'link', isFill: r.kind === 'fill', unread: !!r.unread,
          on: on, off: !on, segs: segs(r.title), selText: on ? 'true' : 'false',
          style: 'display: flex; align-items: center; gap: 12px; height: 40px; flex: none; padding: 0 12px; border: 0; border-radius: 8px; text-decoration: none; color: #0A0A0A; font: inherit; background: ' + (on ? 'rgba(10,10,10,0.06)' : 'transparent'),
          iconStyle: 'flex: none; color: ' + (on ? '#0A0A0A' : '#737373'),
          hover: function () { if (self.state.sel !== i) self.setState({ sel: i }); },
          more: function (e) { e.preventDefault(); e.stopPropagation(); self.setState({ sel: i, menu: 'actions', msel: 0 }); }
        });
      }) };
    });

    var cur = flat[sel];
    // Claude-style peek beside the palette, level with the selected row (list scroll ignored)
    var pm = cur && cur.mail && st.menu !== 'actions' ? cur.mail : null;
    if (st.ask) pm = null; // asking hides the results and their card
    var preview = { show: !!pm };
    if (pm) {
      var DATE = { '昨天': '昨天 21:03', '09:52': '今天 09:52 · 草稿', '10/18': '10 月 18 日', '08:15': '今天 08:15', '09:41': '今天 09:41', '周一': '周一 17:30', '10/02': '10 月 2 日' };
      preview = { show: true, from: (pm.to || '') + pm.sub, date: DATE[pm.meta] || pm.meta, folder: pm.folder || '', initial: Array.from(pm.sub)[0].toUpperCase(),
        avatarStyle: avatarStyle(pm.sub), subject: segs(pm.t), body: segs(pm.body), file: pm.file || '', fileIcon: I.file,
        style: 'position: absolute; left: 1048px; top: ' + Math.min(96 + 102 + selY - 12, 600) + 'px; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: rgba(255,255,255,0.8); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(10,10,10,0.08); border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1)' };
    }
    var acts = st.menu === 'actions' && cur ? ACTIONS[cur.act] || ACTIONS.cmd : [];
    var msel = Math.min(st.msel, Math.max(acts.length - 1, 0));
    // under the selected row, its right edge on the row's; kept inside the list
    var menuTop = Math.min(selY + 44, 452 - (34 + acts.length * 34));
    var menu = { open: acts.length > 0, title: cur ? cur.title : '', style: 'position: absolute; right: 8px; top: ' + menuTop + 'px; width: 220px; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: rgba(255,255,255,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(10,10,10,0.08); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1)', items: acts.map(function (a, i) {
      return { label: a[0], kbd: a[1], keys: keysOf(a[1]), pick: function () { self.setState({ menu: '' }); }, hover: function () { self.setState({ msel: i }); },
        style: 'display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; color: #0A0A0A; text-align: left; background: ' + (i === msel ? 'rgba(10,10,10,0.06)' : 'transparent') };
    }) };

    // a keycap each key: each modifier and arrow its own, the rest one (Esc, Space)
    function keysOf(k) { var out = []; k = k || ''; while (k && '⌘⇧⌥⌃←→↑↓'.indexOf(k[0]) >= 0) { out.push({ t: k[0] }); k = k.slice(1); } if (k) out.push({ t: k }); return out; }
    var SCOPES = [['all', '全部'], ['mail', '邮件'], ['chats', '对话'], ['people', '联系人'], ['files', '附件']];
    var go = function (d) {
      var k = SCOPES.map(function (s) { return s[0]; }).indexOf(scope);
      self.setState({ scope: SCOPES[(k + d + SCOPES.length) % SCOPES.length][0], sel: 0, menu: '' });
    };
    var dialog = function (e) { return e.currentTarget.closest('[role=dialog]'); };

    return {
      query: q, placeholder: st.menu === 'filter' ? '选择筛选条件' : '搜索',
      noResults: active && !flat.length,
      chips: F.map(function (f) { return { label: f, remove: function () { self.setState({ filters: F.filter(function (x) { return x !== f; }), sel: 0 }); } }; }),
      tabs: SCOPES.map(function (s) {
        var on = s[0] === scope;
        return { label: s[1], selText: on ? 'true' : 'false', pick: function () { self.setState({ scope: s[0], sel: 0, menu: '' }); },
          style: 'height: 32px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 14px; background: ' + (on ? 'rgba(10,10,10,0.06)' : 'transparent') + '; color: ' + (on ? '#0A0A0A' : '#404040') + '; font-weight: ' + (on ? '500' : '400') };
      }),
      sections: sections, menu: menu, preview: preview, searching: !st.ask, asking: !!st.ask,
      // Tab turns the box into a question to Wit and back, the text kept
      toggleAsk: function () { self.setState({ ask: !st.ask, menu: '' }); },
      onAskKey: function (e) {
        if (e.key === 'Tab') { e.preventDefault(); self.setState({ ask: false }); }
        else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dialog(e).querySelector('a[href="Ask.dc.html"]').click(); }
      },
      onInput: function (e) { self.setState({ q: e.target.value, sel: 0, menu: st.menu === 'actions' ? '' : st.menu }); },
      onKey: function (e) {
        var k = e.key;
        if (st.menu === 'actions') {
          if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); self.setState({ msel: (msel + (k === 'ArrowDown' ? 1 : -1) + acts.length) % acts.length }); }
          else if (k === 'Enter' || k === 'Escape') { e.preventDefault(); self.setState({ menu: '' }); }
          return;
        }
        if (k === 'ArrowDown' || k === 'ArrowUp') {
          e.preventDefault();
          if (flat.length) self.setState({ sel: (sel + (k === 'ArrowDown' ? 1 : -1) + flat.length) % flat.length });
        } else if ((k === 'ArrowLeft' || k === 'ArrowRight') && !q) {
          // with text in the box the arrows move the caret; ⌃Tab switches type then
          e.preventDefault(); go(k === 'ArrowRight' ? 1 : -1);
        } else if (k === 'Tab' && e.ctrlKey) {
          e.preventDefault(); go(e.shiftKey ? -1 : 1);
        } else if (k === 'Tab') {
          e.preventDefault(); self.setState({ ask: true, menu: '' });
        } else if (k === '/' && (!q || / $/.test(q))) {
          // a slash inside a word stays text, so dates like 10/02 still search
          e.preventDefault(); self.setState({ menu: 'filter', sel: 0 });
        } else if (k === 'Backspace' && !q && F.length) {
          self.setState({ filters: F.slice(0, -1), sel: 0 });
        } else if (k === 'Escape') {
          e.preventDefault();
          if (st.menu) self.setState({ menu: '', sel: 0 }); else if (q) self.setState({ q: '', sel: 0 });
        } else if (k === 'Enter' && e.altKey) {
          e.preventDefault(); if (cur && cur.kind !== 'fill') self.setState({ menu: 'actions', msel: 0 });
        } else if (k === 'Enter') {
          e.preventDefault();
          // shortcut: the prototype "opens" a row by clicking its option; the app routes by row kind.
          var opt = dialog(e).querySelector(e.metaKey ? 'a[href="MainSearch.dc.html"]' : '[role=option][aria-selected=true]');
          if (opt) opt.click();
        }
      }
    };
  }
}
</script>
