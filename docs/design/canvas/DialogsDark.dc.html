<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弹层 · 深色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 720px; height: 860px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; align-items: flex-start; background: #0A0A0A; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #FAFAFA">

  <div style="display: flex; flex-direction: column; gap: 16px; width: 640px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 16px; font-weight: 600">深色 · md 560 · 添加账户</div>
      <div style="font-size: 13px; line-height: 1.5; color: #A1A1A1">面板抬到 #171717（新 token：surface-raised），遮罩黑 40% + 4px 模糊<br>面板比背后亮一档，靠明度分层，不靠描边</div>
    </div>
    <div style="height: 720px; border-radius: 0px; display: flex; justify-content: center; align-items: flex-start; padding-top: 64px; box-sizing: border-box; background-color: #00000066; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
      <div style="width: 560px; box-sizing: border-box; border-radius: 16px; background: #171717; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden">
        <div style="display: flex; align-items: flex-start; gap: 16px; padding: 16px 16px 0 16px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding-top: 0px">
            <div style="font-size: 16px; font-weight: 600; line-height: 1.4">添加账户</div>
            <div style="color: #A1A1A1; line-height: 1.6">输入邮箱地址，自动识别服务商；也可以直接在下面选择。</div>
          </div>
          <button type="button" aria-label="关闭" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #A1A1A1; display: flex; align-items: center; justify-content: center; padding: 0; flex: none; margin-right: -8px; margin-top: -8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px">
          <div style="display: flex; gap: 8px">
            <input type="email" aria-label="邮箱地址" placeholder="you@example.com" style="flex: 1; min-width: 0; height: 36px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 0 12px; font-size: 14px; color: #FAFAFA; background: rgba(255,255,255,0.04)">
            <button type="button" disabled style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #E5E5E5; opacity: 0.5; color: #171717; font-weight: 500">继续</button>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; color: #A1A1A1; font-size: 12px"><div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1)"></div>或选择服务商<div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1)"></div></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.03); text-align: left"><span style="width: 28px; height: 28px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #404040">G</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; color: #FAFAFA">Gmail</span><span style="font-size: 12px; color: #A1A1A1">应用专用密码</span></span></button>
            <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.03); text-align: left"><span style="width: 28px; height: 28px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #404040">O</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; color: #FAFAFA">Outlook / Hotmail</span><span style="font-size: 12px; color: #A1A1A1">浏览器登录</span></span></button>
            <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.03); text-align: left"><span style="width: 28px; height: 28px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #404040">163</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; color: #FAFAFA">网易 163 邮箱</span><span style="font-size: 12px; color: #A1A1A1">授权码</span></span></button>
            <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.03); text-align: left"><span style="width: 28px; height: 28px; border-radius: 6px; background: #262626; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #FAFAFA">@</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; color: #FAFAFA">其他 IMAP 邮箱</span><span style="font-size: 12px; color: #A1A1A1">手动设置</span></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":860}}'>

  renderVals() { return {}; }

</body>
</html>
