        </section>
        <section style="display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; padding: 20px 0; border-top: 1px solid #F0F0F0">
          <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 14px; font-weight: 600">语言</h2></div>

        </section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'system', sw: { autostart: true, background: true, tray: false, notify: true, smartOnly: false, preview: false } };
  }
  renderVals() {
    var self = this;
    var pal = { light: ['#ECECEC', '#F9F9F9', '#FFFFFF', '#E5E5E5'], dark: ['#1C1C1C', '#232323', '#171717', '#333333'] };
    var tile = function (id, name, colors, split) {
      var on = self.state.theme === id;
      var c = colors;
      return {
        name: name,
        pick: function () { self.setState({ theme: id }); },
        frame: 'width: 132px; height: 84px; box-sizing: border-box; display: flex; overflow: hidden; border-radius: 8px; border: ' + (on ? '2px solid #171717' : '1px solid #E5E5E5') + '; background: ' + c[0] + (split ? '; background-image: linear-gradient(135deg, #ECECEC 50%, #1C1C1C 50%)' : ''),
        rail: 'width: 14px',
        side: 'width: 34px; margin-top: 10px; background: ' + c[1] + '; border-top-left-radius: 6px',
        body: 'flex: 1; margin-top: 10px; background: ' + c[2] + '; display: flex; flex-direction: column; gap: 6px; padding: 10px',
        line: 'height: 5px; width: 70%; border-radius: 3px; background: ' + c[3],
        line2: 'height: 5px; width: 45%; border-radius: 3px; background: ' + c[3]
      };
    };
    var sw = {};
    Object.keys(this.state.sw).forEach(function (k) {
      var on = self.state.sw[k];
      sw[k] = {
        on: on ? 'true' : 'false',
        toggle: function () { var n = Object.assign({}, self.state.sw); n[k] = !on; self.setState({ sw: n }); },
        track: 'flex: none; width: 32px; height: 18px; padding: 2px; box-sizing: border-box; border: 0; border-radius: 9px; display: flex; align-items: center; transition: background 120ms; background: ' + (on ? '#171717' : '#E5E5E5') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start'),
        thumb: 'width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)'
      };
    });
    return {
      sw: sw,
      themes: [tile('system', '跟随系统', pal.light, true), tile('light', '浅色', pal.light, false), tile('dark', '深色', pal.dark, false)]
    };
  }
}
</script>
