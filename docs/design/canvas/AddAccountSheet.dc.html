<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 账户 · 添加账户弹窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px">
  <dc-import name="SettingsAccounts" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; border-radius: 12px; background: rgba(10,10,10,0.28); display: flex; align-items: flex-start; justify-content: center; padding-top: 64px">
    <dc-import name="Onboarding" mode="sheet" step="{{step}}" hint-size="560px,640px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["pick","password","oauth","checking","error","done"],"default":"pick"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { step: this.props.step ?? 'pick' }; }
}
</script>
</body>
</html>
