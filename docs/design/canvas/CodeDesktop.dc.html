<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>收到验证码</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D4D4D4}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #D4D4D4; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; color: #0A0A0A">

  <div aria-label="另一个应用：浏览器里的登录页" style="position: absolute; left: 220px; top: 48px; width: 1000px; height: 828px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(10,10,10,0.08), 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column">
    <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #FAFAFA; border-bottom: 1px solid #E5E5E5">
      <span aria-hidden="true" style="display: flex; gap: 8px">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
      </span>
      <span style="flex: 1; max-width: 480px; margin: 0 auto; height: 28px; border-radius: 6px; background: #F5F5F5; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #737373">id.acme.example/verify</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600">输入验证码</h1>
        <p style="margin: 0; font-size: 14px; color: #737373">验证码已发送到 you@example.com</p>
      </div>
      <div style="display: flex; gap: 8px">
        <input aria-label="验证码第 1 位" style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid #0A0A0A; border-radius: 8px; box-shadow: 0 0 0 3px rgba(161,161,161,0.5); text-align: center; font-size: 20px">
        <input aria-label="验证码第 2 位" style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 8px">
        <input aria-label="验证码第 3 位" style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 8px">
        <input aria-label="验证码第 4 位" style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 8px">
        <input aria-label="验证码第 5 位" style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 8px">
        <input aria-label="验证码第 6 位" style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid #E5E5E5; border-radius: 8px">
      </div>
      <button type="button" disabled style="width: 312px; height: 40px; border: 0; border-radius: 8px; background: #E5E5E5; color: #737373; font-size: 14px; font-weight: 500">继续</button>
    </div>
    <div style="flex: none; display: flex; justify-content: center; gap: 24px; padding: 24px 0 32px; font-size: 13px; color: #737373; border-top: 1px solid #E5E5E5">
      <span>没收到？重新发送</span><span>换一种方式登录</span><span>帮助中心</span><span>隐私政策</span>
    </div>
  </div>

  <div style="position: absolute; left: 560px; top: 812px">
    <dc-import name="CodeCard" hint-size="320px,48px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
