<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Toast 四种状态</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 960px; height: 440px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 20px; background: #FAFAFA; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; color: #0A0A0A">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Toast</h1>
    <p style="margin: 0; font-size: 13px; color: #737373">顶栏下方居中，最新的在最上面，最多同时三条；4 秒后消失，指针停留时暂停。有色的三种用同色系浅色底、边框、深色字；普通的白底灰边、不带图标。</p>
  </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #0A0A0A">普通</span>
      <div style="width: 360px; flex: none"><div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 420px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E5; box-shadow: 0 4px 16px rgba(10,10,10,0.08); font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #0A0A0A">
      <span style="flex: 1; font-weight: 500">链接已复制</span>
      <button type="button" aria-label="关闭" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: #737373; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg></button>
    </div></div>
      <span style="font-size: 13px; color: #737373">复制、一般告知</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #0A0A0A">成功</span>
      <div style="width: 360px; flex: none"><div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 420px; box-sizing: border-box; border-radius: 16px; background: #F0FDF4; border: 1px solid #B9F8CF; box-shadow: 0 4px 16px rgba(10,10,10,0.08); font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #008236">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="成功" style="flex: none"><path d="M4 12C4 7.58172 7.58172 4 12 4C16.4183 4 20 7.58172 20 12C20 16.4183 16.4183 20 12 20C7.58172 20 4 16.4183 4 12ZM12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM17.4571 9.45711L16.0429 8.04289L11 13.0858L8.20711 10.2929L6.79289 11.7071L11 15.9142L17.4571 9.45711Z"></path></svg><span style="flex: 1; font-weight: 500">设置已保存</span>
      <button type="button" aria-label="关闭" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: #008236; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg></button>
    </div></div>
      <span style="font-size: 13px; color: #737373">发送、保存、重新登录、密码更新</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #0A0A0A">警告</span>
      <div style="width: 360px; flex: none"><div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 420px; box-sizing: border-box; border-radius: 16px; background: #FFFBEB; border: 1px solid #FFD230; box-shadow: 0 4px 16px rgba(10,10,10,0.08); font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #973C00">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="警告" style="flex: none"><path d="M12.8659 3.00017L22.3922 19.5002C22.6684 19.9785 22.5045 20.5901 22.0262 20.8662C21.8742 20.954 21.7017 21.0002 21.5262 21.0002H2.47363C1.92135 21.0002 1.47363 20.5525 1.47363 20.0002C1.47363 19.8246 1.51984 19.6522 1.60761 19.5002L11.1339 3.00017C11.41 2.52187 12.0216 2.358 12.4999 2.63414C12.6519 2.72191 12.7782 2.84815 12.8659 3.00017ZM4.20568 19.0002H19.7941L11.9999 5.50017L4.20568 19.0002ZM10.9999 16.0002H12.9999V18.0002H10.9999V16.0002ZM10.9999 9.00017H12.9999V14.0002H10.9999V9.00017Z"></path></svg><span style="flex: 1; font-weight: 500">先接受或拒绝助手的修改</span>
      <button type="button" aria-label="关闭" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: #973C00; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg></button>
    </div></div>
      <span style="font-size: 13px; color: #737373">操作被拦下、部分跳过、缺少必填项</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #0A0A0A">失败</span>
      <div style="width: 360px; flex: none"><div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 420px; box-sizing: border-box; border-radius: 16px; background: #FEF2F2; border: 1px solid #FFC9C9; box-shadow: 0 4px 16px rgba(10,10,10,0.08); font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #C10007">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="失败" style="flex: none"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12 10.5858L14.8284 7.75736L16.2426 9.17157L13.4142 12L16.2426 14.8284L14.8284 16.2426L12 13.4142L9.17157 16.2426L7.75736 14.8284L10.5858 12L7.75736 9.17157L9.17157 7.75736L12 10.5858Z"></path></svg><span style="flex: 1; font-weight: 500">2 封未能处理</span>
      <button type="button" aria-label="关闭" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: #C10007; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg></button>
    </div></div>
      <span style="font-size: 13px; color: #737373">操作失败、错误</span>
    </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":440}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
