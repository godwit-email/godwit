<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Godwit 设置 扩展</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#171717}a:hover{color:#0A0A0A}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; border-radius: 12px; overflow: hidden">
<img src="/_blob/878f002c10b0d6c92e36b2bcfb479e8e" alt="" aria-label="桌面壁纸（已模糊）" style="position: absolute; left: -120px; top: -120px; width: 1680px; height: 1140px; object-fit: cover">
<div aria-label="窗口材质" style="position: absolute; inset: 0; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background-color: #FAFAFAF2"></div>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #0A0A0A; background: transparent; border: 1px solid rgba(0, 0, 0, 0.12); border-radius: 12px">
  <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding-left: 88px; position: relative">
    <span aria-hidden="true" style="position: absolute; left: 20px; top: 16px; display: flex; gap: 8px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
    </span>
    <button type="button" aria-label="收起侧栏" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #737373; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3C21.5523 3 22 3.44772 22 4V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3H21ZM7 5H4V19H7V5ZM20 5H9V19H20V5Z"></path></svg></button>
    <a href="Main.dc.html" aria-label="后退" style="width: 28px; height: 28px; border-radius: 6px; color: #737373; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.82843 10.9999H20V12.9999H7.82843L13.1924 18.3638L11.7782 19.778L4 11.9999L11.7782 4.22168L13.1924 5.63589L7.82843 10.9999Z"></path></svg></a>
    <button type="button" aria-label="前进" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #A1A1A1; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg></button>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; box-sizing: border-box; padding: 0 8px 8px 8px">
    <div style="flex: 1; min-width: 0; display: flex; gap: 8px">
    <dc-import name="SettingsSidebar" current="extensions" hint-size="248px,848px"></dc-import>
    <div style="flex: 1; min-width: 0; display: flex; overflow: auto; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 12px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05)">

    

    <main style="flex: 1 1 auto; align-self: flex-start; min-width: 0; max-width: 760px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><h1 style="margin: 0; font-size: 29px; line-height: 1.25; font-weight: 600">扩展</h1><span style="color: #737373">Skill 写 prompt 就能用；插件运行在沙箱里，只能用你批准的权限；MCP 给 Wit 接入外部工具。</span></div><button type="button" onClick="{{openAdd}}" style="flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: #171717; color: #FFFFFF; font-weight: 500">从文件夹安装</button></div>
<div role="tablist" aria-label="扩展类型" style="display: flex; gap: 4px; border-bottom: 1px solid #E5E5E5">
        <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #737373">Skill · 5</button>
        <button type="button" role="tab" aria-selected="true" style="height: 32px; padding: 0 12px; border: 0; border-bottom: 2px solid #171717; background: transparent; color: #0A0A0A; font-weight: 600">插件 · 4</button>
        <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #737373">MCP · 1</button>
      </div>
<section style="flex: none; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600">插件</h2>
<div style="border: 1px solid #E5E5E5; border-radius: 12px; background: #FFFFFF; overflow: hidden"><div style="display: flex; flex-direction: column; margin-top: -1px">
<sc-for list="{{plugins}}" as="p" hint-placeholder-count="4">
<sc-if value="{{p.enabled}}" hint-placeholder-val="{{ true }}"><dc-import name="SettingsRow" label="{{p.name}}" desc="{{p.desc}}" control="switch" on="true" hint-size="100%,48px"></dc-import></sc-if>
<sc-if value="{{p.pending}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #E5E5E5">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 8px 16px">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">{{p.name}} <span style="font-weight: 400; font-size: 12px; color: #737373">0.1.0</span></span><span style="font-size: 12px; color: #737373">{{p.desc}}</span></span>
<span style="flex: none; padding: 2px 8px; border-radius: 4px; background: #FFFBEB; color: #973C00; font-size: 12px">待授权</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 16px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 8px; background: #FAFAFA"><span style="font-weight: 500">它请求的权限</span><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
              <li style="display: flex; gap: 10px; align-items: baseline"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #F5F5F5">mail:read</span><span>读取你打开的邮件内容</span></li>
              <li style="display: flex; gap: 10px; align-items: baseline"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #F5F5F5">net</span><span>只能访问 api-free.deepl.com、api.deepl.com</span></li>
              <li style="display: flex; gap: 10px; align-items: baseline; color: #737373"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #F5F5F5">不包含</span><span>修改邮件、调用大模型、发送邮件（任何插件都不能发送）</span></li>
            </ul></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-weight: 500">配置 <span style="font-weight: 400; font-size: 12px; color: #737373">· 表单由插件的 config 声明生成</span></span>
<label style="display: flex; flex-direction: column; gap: 6px"><span>DeepL API Key</span><input type="password" placeholder="粘贴你的 key" style="height: 32px; box-sizing: border-box; width: 100%; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; font: inherit; color: #0A0A0A"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span>套餐</span><select onChange="{{pickPlan}}" style="height: 32px; box-sizing: border-box; width: 100%; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; font: inherit; color: #0A0A0A"><option value="Free">Free</option><option value="Pro">Pro</option></select></label>
<sc-if value="{{isPro}}" hint-placeholder-val="{{ false }}"><label style="display: flex; flex-direction: column; gap: 6px"><span>自定义地址 <span style="font-size: 12px; color: #737373">（套餐为 Pro 时显示）</span></span><input type="url" placeholder="https://api.deepl.com" style="height: 32px; box-sizing: border-box; width: 100%; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; font: inherit; color: #0A0A0A; font-family: 'Geist Mono', monospace; font-size: 12px"></label></sc-if>
</div>
<div style="display: flex; gap: 8px"><button type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: #171717; color: #FFFFFF; font-weight: 500">允许并启用</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; color: #0A0A0A">暂不启用</button></div>
</div>
</div>
</sc-if>
</sc-for>
</div></div>
<span style="font-size: 12px; color: #737373">任何插件都不能发送邮件。</span>
</section>
</main>
  
    </div></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: 'Free' };
  }
  renderVals() {
    var self = this;
    var rows = [
      ['内置 · 验证码与登录链接', '在本机识别新邮件里的验证码和登录链接，一键复制或打开', false],
      ['deepl-translate', '用 DeepL 翻译邮件，不经过大模型', true],
      ['flight-cards', '航班邮件显示行程卡片', false],
      ['attachment-check', '发送前检查遗漏的附件', false]
    ];
    return {
      openAdd: function () {},
      plugins: rows.map(function (r) { return { name: r[0], desc: r[1], pending: r[2], enabled: !r[2] }; }),
      isPro: this.state.plan === 'Pro',
      pickPlan: function (e) { self.setState({ plan: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
