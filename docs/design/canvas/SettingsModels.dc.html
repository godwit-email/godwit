<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Godwit 设置 模型服务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#171717}a:hover{color:#0A0A0A}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; color: #0A0A0A; background: #ECECEC; border: 1px solid #D4D4D4; border-radius: 12px">
  <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding-left: 88px; position: relative">
    <span aria-hidden="true" style="position: absolute; left: 20px; top: 16px; display: flex; gap: 8px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
    </span>
    <button type="button" aria-label="收起侧栏" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #737373; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button>
    <a href="Main.dc.html" aria-label="后退" style="width: 28px; height: 28px; border-radius: 6px; color: #737373; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <button type="button" aria-label="前进" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #A3A3A3; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    <span style="position: absolute; left: 304px; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding-left: 16px; border-left: 1px solid #DDDDDD; margin: 10px 0">
      <span style="font-weight: 600">设置</span>
      <span style="font-size: 12px; color: #737373">模型服务</span>
    </span>
    <span style="margin-left: auto; margin-right: 16px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #737373"><span style="width: 6px; height: 6px; border-radius: 50%; background: #16A34A"></span>已同步 · 刚刚</span>
  </div>
  <div style="flex: 1; min-height: 0; display: flex">
    <nav aria-label="主导航" style="flex: 0 0 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 12px"><a href="Main.dc.html" aria-label="邮件" style="width: 40px; height: 40px; border-radius: 10px; color: #737373; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg></a><a href="Ask.dc.html" aria-label="Wit" style="width: 40px; height: 40px; border-radius: 10px; color: #737373; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></a><a href="SettingsModels.dc.html" aria-label="设置" aria-current="page" style="margin-top: auto; width: 40px; height: 40px; border-radius: 10px; background: #DEDEDE; color: #0A0A0A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a></nav>
    <aside aria-label="设置" style="flex: 0 0 248px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 12px; min-width: 0; background: #F9F9F9; border-top: 1px solid #E5E5E5; border-left: 1px solid #E5E5E5; border-right: 1px solid #E5E5E5; border-top-left-radius: 14px; overflow: hidden"><div style="padding: 4px 6px 10px; font-size: 18px; font-weight: 600">设置</div><div style="padding: 14px 8px 6px; font-size: 12px; color: #737373; padding-top: 4px">账户</div><a href="SettingsAccounts.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: transparent; font-weight: 400; justify-content: flex-start; gap: 8px"><span style="width: 20px; height: 20px; border-radius: 5px; background: #EDEDED; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #404040">QQ</span><span style="flex: 1">you@example.com</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #16A34A"></span></a><a href="SettingsAccountsReauth.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: transparent; font-weight: 400; justify-content: flex-start; gap: 8px"><span style="width: 20px; height: 20px; border-radius: 5px; background: #EDEDED; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #404040">O</span><span style="flex: 1">work@company.example</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #F59E0B"></span></a><a href="AddAccountSheet.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: transparent; font-weight: 400; color: #737373; justify-content: flex-start; gap: 8px"><span style="width: 20px; text-align: center">+</span>添加账户</a><div style="padding: 14px 8px 6px; font-size: 12px; color: #737373">应用</div><a href="SettingsGeneral.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; font-weight: 400; background: transparent"><span>通用</span></a><a href="SettingsModels.dc.html" aria-current="page" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: #EDEDED; font-weight: 500"><span>模型服务</span></a><a href="SettingsExtensions.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: transparent; font-weight: 400"><span>扩展</span></a><a href="#" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: transparent; font-weight: 400"><span>隐私与安全</span></a><a href="#" style="display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 8px 0 8px; border-radius: 8px; text-decoration: none; color: #0A0A0A; background: transparent; font-weight: 400"><span>关于</span></a></aside>
    <div style="flex: 1; min-width: 0; background: #FFFFFF; border-top: 1px solid #E5E5E5; display: flex; overflow: auto; ">

    

    <main style="flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 1040px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 22px; font-weight: 600">模型服务</h1>
          <span style="color: #737373">支持 OpenAI 兼容和 Anthropic 兼容接口。想用订阅账户，可以先运行本地网关，再把它的地址填进来。</span>
        </div>
        <button type="button" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #0A0A0A; color: #FFFFFF; font-weight: 500">添加服务</button>
      </div>

      <div style="display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 10px; background: #FFFFFF; overflow: hidden">
        <sc-for list="{{services}}" as="s" hint-placeholder-count="3">
          <div style="{{s.rowStyle}}">
            <span style="width: 36px; height: 32px; border-radius: 8px; background: #F5F5F5; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; flex: none">{{s.badge}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span style="font-weight: 500">{{s.name}} <span style="font-weight: 400; color: #737373; font-size: 13px">· {{s.kind}}</span></span>
              <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #737373; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.url}}</span>
            </span>
            <span style="font-size: 13px; color: #737373">{{s.models}}</span>
            <sc-if value="{{s.isDefault}}" hint-placeholder-val="{{ false }}">
              <span style="padding: 2px 8px; border-radius: 4px; background: #F5F5F5; color: #0A0A0A; font-size: 12px">默认</span>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <section aria-label="编辑服务" style="border: 1px solid #E5E5E5; border-radius: 10px; background: #FFFFFF; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600; grid-column: span 2">编辑：OpenAI</h2>
        <div role="radiogroup" aria-label="接口类型" style="grid-column: span 2; display: flex; gap: 8px">
          <label style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #171717; border-radius: 8px; background: #F5F5F5"><input type="radio" name="kind" checked>OpenAI 兼容</label>
          <label style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #E5E5E5; border-radius: 8px"><input type="radio" name="kind">Anthropic 兼容</label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 500">名称</span><input type="text" value="OpenAI" style="height: 32px; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 6px"></label>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 500">Base URL</span><input type="url" value="https://api.openai.com/v1" style="height: 32px; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 6px; font-family: 'Geist Mono', monospace; font-size: 13px"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2">
          <span style="font-weight: 500">API Key</span>
          <input type="password" placeholder="已配置 · 留空表示保持不变" style="height: 32px; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 6px">
          <span style="font-size: 13px; color: #737373">保存在系统钥匙串，界面和日志中不会显示。</span>
        </label>
        <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 8px">
          <span style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-weight: 500">模型</span>
            <button type="button" style="height: 30px; padding: 0 10px; border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF; color: #0A0A0A">从 /models 拉取</button>
          </span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #E5E5E5; border-radius: 6px"><input type="checkbox" checked>[MODEL A]</label>
            <label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #E5E5E5; border-radius: 6px"><input type="checkbox" checked>[MODEL B]</label>
            <label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #E5E5E5; border-radius: 6px"><input type="checkbox">[MODEL C]</label>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2">
          <span style="font-weight: 500">默认模型（所有 skill 和Wit使用，单个 skill 可以覆盖）</span>
          <select style="height: 32px; padding: 0 8px; border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF"><option>OpenAI / [MODEL A]</option></select>
        </label>
        <div style="grid-column: span 2; display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
          <button type="button" style="height: 32px; padding: 0 16px; border: 0; border-radius: 8px; background: #171717; color: #FFFFFF; font-weight: 500">保存</button>
          <button type="button" style="height: 32px; padding: 0 14px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; color: #0A0A0A">测试连接</button>
          <span style="display: flex; align-items: center; gap: 6px; color: #15803D; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #16A34A"></span>连接正常 · 312 ms</span>
          <button type="button" style="margin-left: auto; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #DC2626">删除此服务</button>
        </div>
      </section>
    </main>
  
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['AI', 'OpenAI', 'OpenAI 兼容', 'https://api.openai.com/v1', '2 个模型', true],
      ['AN', 'Anthropic', 'Anthropic 兼容', 'https://api.anthropic.com', '1 个模型', false],
      ['GW', '本地网关', 'OpenAI 兼容', 'http://127.0.0.1:[PORT]/v1', '9 个模型', false]
    ];
    return {
      services: rows.map(function (r, i) {
        return {
          badge: r[0], name: r[1], kind: r[2], url: r[3], models: r[4], isDefault: r[5],
          rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 16px; ' + (i ? 'border-top: 1px solid #F5F5F5; ' : '') + 'background: ' + (i === 0 ? '#FAFAFA' : '#FFFFFF')
        };
      })
    };
  }
}
</script>
</body>
</html>
