<!-- @dsCard group="Feedback" height=200 width=640 subtitle="Warning, danger, info" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--background);font-family:Geist,"PingFang SC",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;gap:12px}
.a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-xl);border:1px solid}
.a span{flex:1}
.w{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning-text)}
.d{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 30%,transparent);color:var(--danger)}
.i{background:var(--background);border-color:var(--border);color:var(--foreground)}
button{height:28px;padding:0 10px;border:0;border-radius:var(--radius-md);font:inherit;font-weight:500;color:var(--on-solid)}
.w button{background:var(--warning-text)}.d button{background:var(--danger)}.i button{background:var(--primary);color:var(--primary-text)}
</style></head><body>
<div class="a w" role="status"><span>me@qq.com 的登录已过期，新邮件暂停同步。</span><button>重新登录</button></div>
<div class="a d" role="alert"><span>默认服务 OpenAI 的 Key 失效，Wit 和总结暂时不可用。</span><button>更新 Key</button></div>
<div class="a i" role="status"><span>有新版本，重启后安装。</span><button>立即重启</button></div>
</body></html>
