<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--background);font-family:Geist,"PingFang SC",system-ui,sans-serif;font-size:12px;color:var(--foreground);display:flex;flex-direction:column;gap:8px}
.box{min-height:32px;box-sizing:border-box;padding:3px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;border:1px solid var(--input);border-radius:var(--radius-md);font-family:"Geist Mono",ui-monospace,monospace}
.tok{height:24px;display:inline-flex;align-items:center;gap:4px;padding:0 4px 0 8px;border-radius:var(--radius-sm);background:var(--hover);font-family:Geist,"PingFang SC",sans-serif}
.tok button{width:16px;height:16px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:10px}
.row{display:flex;align-items:center;gap:8px;color:var(--muted)}
.row button{height:28px;padding:0 10px;border:1px solid var(--input);border-radius:var(--radius-lg);background:var(--background);box-shadow:var(--shadow-xs);font:inherit;color:var(--foreground)}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
</style></head><body>
<div class="box"><span class="tok">发件人<button aria-label="删除「发件人」">✕</button></span>/<span class="tok">年月<button aria-label="删除「年月」">✕</button></span>-账单</div>
<div class="row">插入<button>＋ 日期</button><button>＋ 发件人</button><button>＋ 主题</button></div>
<div class="row">示例 <span class="mono">Acme/2026-11-账单</span></div>
</body></html>
