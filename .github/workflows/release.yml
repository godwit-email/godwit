name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # the release, its tag, and the uploads to it
  pull-requests: write # the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps a release PR open that bumps mygo.json and CHANGELOG.md; merging
      # it creates the draft release that the build job fills.
      - id: release
        uses: googleapis/release-please-action@v5

  # Here, not on the tag: a tag pushed with GITHUB_TOKEN starts no workflow.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: jdx/mise-action@v2
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # shortcut: macOS builds are signed ad hoc (Gatekeeper blocks them on other Macs); add the Developer ID and notarization steps from mygo's docs/github-actions.md once the certificate is in the secrets.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
