name: SDK

on:
  pull_request:
    paths:
      - "sdk/**"
      - "core/plugins/testdata/sdk-types/**"
      - ".github/workflows/sdk.yml"
  push:
    branches: [main]
    tags: ["sdk-v*"]
    paths:
      - "sdk/**"
      - "core/plugins/testdata/sdk-types/**"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: sdk
      - run: npm test
        working-directory: sdk

  publish:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release tag and reviewed commit
        run: |
          node --input-type=module -e 'import pkg from "./sdk/package.json" with { type: "json" }; if (process.env.GITHUB_REF_NAME !== `sdk-v${pkg.version}`) throw new Error("SDK tag must match package version")'
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts
        working-directory: sdk
      - run: npm publish --access public --provenance --ignore-scripts
        working-directory: sdk
        env:
          # Bootstrap the new package with a token; remove it after enabling npm OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
