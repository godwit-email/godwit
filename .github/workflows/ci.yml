name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_macos:
        description: Build and notarize both macOS architectures without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # save the Go build cache

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the workflow/check names present; skip the expensive client jobs
  # when the only changed paths are in the independently checked site/.
  changes:
    runs-on: [self-hosted, linux, x64, godwit-racknerd-us]
    outputs:
      client: ${{ steps.paths.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "$BASE" "$HEAD")
          elif [[ "$BASE" =~ ^0+$ ]]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BASE"
          fi

          # Treat renames as deletion + addition, so moving client code into
          # site/ cannot hide the deletion from the client checks.
          if git diff --quiet --no-renames "$base" "$HEAD" -- . ':(top,exclude)site/**'; then
            echo "client=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then exit "$status"; fi
            echo "client=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: [self-hosted, linux, x64, godwit-rfc-jp]
          - name: macos-latest
            os: macos-latest
          - name: windows-latest
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Exclude Go temp and workspace from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:TEMP, $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - id: go-cache
        if: runner.environment == 'github-hosted'
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          # Job id so test and package do not overwrite one immutable entry.
          key: ${{ runner.os }}-gocache-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gocache-${{ github.job }}-
      - run: mise run generate
      - name: Test macOS provisioning profile checks
        if: runner.os == 'macOS'
        run: |
          swiftc -D PROFILE_TEST scripts/macos_profile.swift scripts/macos_profile_test.swift -o "$RUNNER_TEMP/macos-profile-tests"
          "$RUNNER_TEMP/macos-profile-tests"
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: i18n check
        if: runner.os != 'Windows'
        run: |
          out="$(go tool mygo i18n check 2>&1)"
          printf '%s\n' "$out"
          ! printf '%s\n' "$out" | grep -q 'warning:'
      - name: vet
        run: go vet ./...
      - name: build (no cgo)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: test (no cgo)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 $(go list ./... | grep -vE '/godwit/(app|core|webui|internal/richtext)$')
          # Keep wall-clock performance checks from competing with other packages.
          go test -p 1 -count=1 ./internal/richtext
          # core, app and webui have no t.Parallel; run 4 worker processes so all cores stay busy.
          for pkg in ./core ./app ./webui; do
            bin="$RUNNER_TEMP/$(basename "$pkg").test.exe"
            go test -c -o "$bin" "$pkg"
            tests=$("$bin" -test.list . | tr -d '\r' | grep '^Test')
            pids=()
            for w in 0 1 2 3; do
              pat=$(printf '%s\n' "$tests" | awk -v n=4 -v i="$w" 'NR % n == i % n' | paste -sd '|' -)
              (cd "$pkg" && "$bin" -test.count=1 -test.timeout=20m -test.run="^($pat)\$") &
              pids+=($!)
            done
            rc=0
            for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
            ((rc == 0)) || exit 1
          done

  # The UI suite (app) and core run their tests one after another in a single
  # process; split core across shards 0 and 5, app across shards 1..4, and run
  # 4 worker processes per runner.
  race:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: race (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            os: [self-hosted, linux, x64, godwit-greencloud-hk]
          - shard: 1
            os: ubuntu-latest
          - shard: 2
            os: ubuntu-latest
          - shard: 3
            os: ubuntu-latest
          - shard: 4
            os: ubuntu-latest
          - shard: 5
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - id: go-cache
        if: runner.environment == 'github-hosted'
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          key: ${{ runner.os }}-gocache-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gocache-${{ github.job }}-
      - run: mise run generate
      - name: test (race)
        env:
          SHARD: ${{ matrix.shard }}
          APP_SHARDS: 4
        run: |
          run_workers() {
            local pkg=$1 shards=$2 idx=$3
            local bin="$RUNNER_TEMP/$(basename "$pkg").test"
            go test -race -c -o "$bin" "$pkg"
            local tests
            tests=$("$bin" -test.list . | grep '^Test' | awk -v n="$shards" -v i="$idx" 'NR % n == i % n')
            local pids=()
            for w in 0 1 2 3; do
              local pat
              pat=$(printf '%s\n' "$tests" | awk -v n=4 -v i="$w" 'NR % n == i % n' | paste -sd '|' -)
              (cd "$pkg" && "$bin" -test.count=1 -test.timeout=20m -test.run="^($pat)\$") &
              pids+=($!)
            done
            local rc=0
            for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
            return "$rc"
          }
          if [[ "$SHARD" == 0 ]]; then
            go test -race -count=1 -timeout 30m $(go list ./... | grep -vE '/godwit/(app|core|webui)$')
            run_workers ./webui 1 0
            run_workers ./core 2 0
          elif [[ "$SHARD" == 5 ]]; then
            run_workers ./core 2 1
          else
            run_workers ./app "$APP_SHARDS" "$SHARD"
          fi

  # Windows packages in the msix job below, which builds it anyway.
  package:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: [self-hosted, linux, x64, godwit-racknerd-us]
          - name: macos-latest
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - id: go-cache
        if: runner.environment == 'github-hosted'
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          key: ${{ runner.os }}-gocache-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gocache-${{ github.job }}-
      - name: Prepare release signing for manual macOS validation
        if: runner.os == 'macOS' && inputs.signed_macos
        uses: ./.github/actions/macos-sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      - name: build (every platform must package)
        if: runner.os != 'macOS' || !inputs.signed_macos
        run: mise run build
      - name: Build and notarize macOS without publishing
        if: runner.os == 'macOS' && inputs.signed_macos
        run: |
          mise run web:install
          mise run native:translate
          mise run native:apple-intelligence
          mise run native:guard-coreml
          go tool mygo build -platform darwin/arm64,darwin/amd64
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && inputs.signed_macos
        with:
          name: Godwit-macOS-notarized
          path: dist/darwin-*/*.dmg
          if-no-files-found: error

  # The Windows build as an MSIX bundle for the Microsoft Store; release.yml submits the same one.
  msix:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/msix.yml
    with:
      # Pull requests check one architecture; main builds both, as the release does.
      archs: ${{ github.event_name == 'pull_request' && 'amd64' || 'amd64,arm64' }}

  web:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: [self-hosted, linux, x64, godwit-racknerd-us]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run web:check
      - name: pi bundle is current
        run: mise run ai:bundle && git diff --exit-code -- core/ai/pi/engine.js
