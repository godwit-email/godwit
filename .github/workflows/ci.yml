name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Keep the workflow/check names present; skip the expensive client jobs
  # when the only changed paths are in the independently checked site/.
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.paths.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "$BASE" "$HEAD")
          elif [[ "$BASE" =~ ^0+$ ]]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BASE"
          fi

          # Treat renames as deletion + addition, so moving client code into
          # site/ cannot hide the deletion from the client checks.
          if git diff --quiet --no-renames "$base" "$HEAD" -- . ':(top,exclude)site/**'; then
            echo "client=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then exit "$status"; fi
            echo "client=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run web:install
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet ./...
      - name: build (no cgo)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: test (no cgo)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: build (every platform must package)
        run: mise run build
      - name: generated client matches the Go code
        shell: bash
        run: git diff --exit-code -- web/src/mygo.ts

  web:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run web:check
