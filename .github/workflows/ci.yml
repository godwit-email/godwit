name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # save the Go build cache

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the workflow/check names present; skip the expensive client jobs
  # when the only changed paths are in the independently checked site/.
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.paths.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "$BASE" "$HEAD")
          elif [[ "$BASE" =~ ^0+$ ]]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BASE"
          fi

          # Treat renames as deletion + addition, so moving client code into
          # site/ cannot hide the deletion from the client checks.
          if git diff --quiet --no-renames "$base" "$HEAD" -- . ':(top,exclude)site/**'; then
            echo "client=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then exit "$status"; fi
            echo "client=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Exclude Go temp from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:TEMP
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - id: go-cache
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          # Job id so test and package do not overwrite one immutable entry.
          key: ${{ runner.os }}-gocache-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gocache-${{ github.job }}-
      - run: mise run web:install
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet ./...
      - name: build (no cgo)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: test (no cgo)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

  package:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - id: go-cache
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          key: ${{ runner.os }}-gocache-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gocache-${{ github.job }}-
      - name: build (every platform must package)
        run: mise run build
      - name: generated client matches the Go code
        shell: bash
        run: git diff --exit-code -- web/src/mygo.ts

  # Trial: can winapp wrap the Windows build in an MSIX? Signed with a throwaway
  # dev certificate; the Store signs its own, so nothing here ships.
  msix:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: microsoft/setup-WinAppCli@v0.1
      - run: mise run web:install
      - name: build the Windows executables
        run: go tool mygo build -platform windows/amd64,windows/arm64
      - name: pack
        shell: pwsh
        run: |
          $version = (Select-String -Path mygo.config.ts -Pattern 'version: "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value + '.0'
          $dirs = foreach ($arch in 'amd64', 'arm64') {
            $dir = "msix-in-$arch"
            New-Item -ItemType Directory $dir | Out-Null
            Copy-Item "dist\windows-$arch\*" $dir -Recurse
            Remove-Item "$dir\*Setup*.exe" -ErrorAction SilentlyContinue # the installer sits beside the app
            winapp manifest generate --executable "$dir\Godwit.exe"
            $manifest = Get-Item *.appxmanifest
            (Get-Content $manifest -Raw) -replace '(<Identity[^>]*?Version=")[^"]*', "`${1}$version" | Set-Content "$dir\$($manifest.Name)" -NoNewline
            Remove-Item $manifest
            $dir
          }
          winapp cert generate
          winapp pack @dirs --cert devcert.pfx
          Get-ChildItem *.msix*
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: "*.msix*"

  web:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run web:check
