name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build (no cgo)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: test (no cgo)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
