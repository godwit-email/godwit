name: Site

# godwit.email: checked on every change to site/, deployed from main.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml", "mise.toml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml", "mise.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run site:check
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # Workers scripts and godwit.email's routes only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
