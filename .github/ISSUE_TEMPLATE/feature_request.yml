name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What you want to do, and what stops you today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
