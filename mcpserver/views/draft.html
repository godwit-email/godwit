<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/* The show tools' views: system fonts and colours only, inlined by bun run views. */
:root {
  color-scheme: light dark;
  font:
    14px / 1.5 system-ui,
    sans-serif;
}
body {
  margin: 0;
  padding: 12px 16px;
}
dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 12px;
  margin: 0 0 12px;
}
dt {
  color: GrayText;
}
dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.body,
.quote,
.signature {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.quote,
.signature,
.attachments {
  margin-top: 12px;
  color: GrayText;
}
.quote {
  border-left: 2px solid GrayText;
  padding-left: 8px;
}
.truncated {
  margin-top: 12px;
  font-style: italic;
}
.subject {
  margin: 0 0 8px;
  font-size: 1.1em;
}
section {
  border-top: 1px solid GrayText;
  padding: 8px 0;
}
section button {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 12px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
section button:disabled {
  cursor: default;
}
section article {
  margin-top: 8px;
}
.from {
  font-weight: 600;
  overflow-wrap: anywhere;
}
.date,
.snippet {
  color: GrayText;
}
.snippet {
  grid-column: 1 / -1;
  overflow-wrap: anywhere;
}
.error {
  color: #c62828;
}
footer {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}
.status {
  margin: 0;
}
</style>
</head>
